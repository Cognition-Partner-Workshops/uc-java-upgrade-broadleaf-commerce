name: Java CI with Maven

on:
  push:
    branches: [ 'BroadleafCommerce-*', main, master ]
  pull_request:
    branches: [ 'BroadleafCommerce-*', main, master ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [ '8' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B compile -DskipTests --no-transfer-progress -pl '!integration' -am

      - name: Run unit tests
        run: mvn -B test --no-transfer-progress -pl '!integration' -am
        continue-on-error: true

      - name: Package
        run: mvn -B package -DskipTests --no-transfer-progress -pl '!integration' -am

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java-${{ matrix.java-version }}
          path: '**/target/surefire-reports/'
          retention-days: 7
