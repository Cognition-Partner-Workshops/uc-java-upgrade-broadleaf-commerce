# =============================================================================
# Broadleaf Search Microservice - Application Configuration
# =============================================================================
# All properties can be overridden via environment variables using the
# Spring Boot relaxed binding convention (e.g., SOLR_MODE, SOLR_URL, etc.)
# =============================================================================

# --- Server Configuration ---
server.port=${SERVER_PORT:8180}
spring.application.name=search-service

# --- Solr Configuration ---
# Deployment mode: "embedded", "standalone", or "cloud"
solr.mode=${SOLR_MODE:standalone}

# Standalone Solr URL
solr.url=${SOLR_URL:http://localhost:8983/solr}

# Primary and reindex core/collection names
solr.primary-name=${SOLR_PRIMARY_NAME:primary}
solr.reindex-name=${SOLR_REINDEX_NAME:reindex}

# Embedded Solr home directory (only used when solr.mode=embedded)
solr.embedded-home=${SOLR_EMBEDDED_HOME:}

# --- SolrCloud Configuration ---
# ZooKeeper connection string for SolrCloud
solr.cloud.zk-host=${SOLR_CLOUD_ZK_HOST:localhost:9983}

# Solr configuration name in ZooKeeper
# Mirrors @Value("${solr.cloud.configName}") in SolrSearchServiceImpl
solr.cloud.config-name=${SOLR_CLOUD_CONFIG_NAME:blc}

# Default number of shards for auto-created collections
# Mirrors @Value("${solr.cloud.defaultNumShards}") in SolrSearchServiceImpl
solr.cloud.default-num-shards=${SOLR_CLOUD_DEFAULT_NUM_SHARDS:2}

# Default replication factor for auto-created collections
solr.cloud.default-replication-factor=${SOLR_CLOUD_DEFAULT_REPLICATION_FACTOR:1}

# --- Indexing Configuration ---
# Whether to use SKU-based indexing instead of product-based
# Mirrors @Value("${solr.index.use.sku}") in SolrIndexServiceImpl
solr.index.use-sku=${SOLR_INDEX_USE_SKU:false}

# Page size for batch indexing operations
# Mirrors @Value("${solr.index.product.pageSize}") in SolrIndexServiceImpl
solr.index.page-size=${SOLR_INDEX_PAGE_SIZE:100}

# Whether to commit after indexing operations
# Mirrors @Value("${solr.index.commit}") in SolrIndexServiceImpl
solr.index.commit=${SOLR_INDEX_COMMIT:true}

# Whether to use soft commit
# Mirrors @Value("${solr.index.softCommit}") in SolrIndexServiceImpl
solr.index.soft-commit=${SOLR_INDEX_SOFT_COMMIT:false}

# Whether to wait for a new searcher after commit
# Mirrors @Value("${solr.index.waitSearcher}") in SolrIndexServiceImpl
solr.index.wait-searcher=${SOLR_INDEX_WAIT_SEARCHER:true}

# Whether to wait for flush to disk after commit
# Mirrors @Value("${solr.index.waitFlush}") in SolrIndexServiceImpl
solr.index.wait-flush=${SOLR_INDEX_WAIT_FLUSH:true}

# Whether to throw an error on concurrent reindex attempts
# Mirrors @Value("${solr.index.errorOnConcurrentReIndex}") in SolrIndexServiceImpl
solr.index.error-on-concurrent-re-index=${SOLR_INDEX_ERROR_ON_CONCURRENT_REINDEX:false}

# --- Catalog Database Configuration (Read-Only) ---
# The microservice reads catalog data directly from the monolith's database.
# Configure this to point at the same database the monolith uses.
spring.datasource.url=${CATALOG_DB_URL:jdbc:h2:mem:searchdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${CATALOG_DB_USERNAME:sa}
spring.datasource.password=${CATALOG_DB_PASSWORD:}
spring.datasource.driver-class-name=${CATALOG_DB_DRIVER:org.h2.Driver}

# JPA / Hibernate settings - read-only access, do not modify the schema
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:}

# --- Actuator / Health Check ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# --- Logging ---
logging.level.com.broadleafcommerce.search=INFO
logging.level.org.apache.solr=WARN
